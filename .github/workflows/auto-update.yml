name: Auto-update
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Scan packages
        id: scan
        run: |
          entries="[]"
          for dir in */; do
            pkg=$(basename "$dir")
            [[ "$pkg" == .* ]] && continue
            [ ! -f "$dir/PKGBUILD" ] && continue

            cur=$(grep -Po '(?<=^pkgver=).*' "$dir/PKGBUILD" || true)
            [ -z "$cur" ] && continue
            url=$(grep -Po '(?<=^url=")[^"]*' "$dir/PKGBUILD" || true)
            repo="${url#https://github.com/}"
            tag=$(gh release view -R "$repo" --json tagName -q .tagName 2>/dev/null) || continue
            latest="${tag#v}"
            [ "$latest" = "$cur" ] && continue

            pyproj_old="https://raw.githubusercontent.com/${repo}/v${cur}/pyproject.toml"
            pyproj_new="https://raw.githubusercontent.com/${repo}/${tag}/pyproject.toml"

            entries=$(python3 scripts/dep_diff.py "$pkg" "$dir" "$cur" "$latest" "$entries" "$pyproj_old" "$pyproj_new")
          done
          echo "matrix={\"include\":$entries}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  create-prs:
    needs: detect
    if: needs.detect.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Bump version
        run: |
          d="${{ matrix.dir }}"
          ver="${{ matrix.latest }}"
          sed -i "s/^pkgver=.*/pkgver=${ver}/" "$d/PKGBUILD"
          sed -i "s/^pkgrel=.*/pkgrel=1/" "$d/PKGBUILD"
          if [ -f "$d/.SRCINFO" ]; then
            sed -i "s/^\([[:space:]]*\)pkgver = .*/\1pkgver = ${ver}/" "$d/.SRCINFO"
          fi

      - name: Build PR body
        id: msg
        run: |
          echo "bump ${{ matrix.pkg }} to v${{ matrix.latest }}" > /tmp/body
          [ -n "${{ matrix.deps_added }}" ] && { echo "" >> /tmp/body; echo "New deps:" >> /tmp/body; echo "${{ matrix.deps_added }}" | while read d; do echo "  + $d" >> /tmp/body; done; }
          [ -n "${{ matrix.deps_removed }}" ] && { echo "" >> /tmp/body; echo "Removed:" >> /tmp/body; echo "${{ matrix.deps_removed }}" | while read d; do echo "  - $d" >> /tmp/body; done; }
          echo "" >> /tmp/body
          echo "---" >> /tmp/body
          echo "Auto-detected. Review and merge to publish to AUR." >> /tmp/body
          body=$(cat /tmp/body)
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$body" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="bump/${{ matrix.pkg }}/v${{ matrix.latest }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "${{ matrix.dir }}"
          git commit -m "${{ steps.msg.outputs.body }}"
          git push origin "$branch"
          gh pr create \
            --title "bump ${{ matrix.pkg }} to v${{ matrix.latest }}" \
            --body "${{ steps.msg.outputs.body }}" \
            --head "$branch" \
            --base master
