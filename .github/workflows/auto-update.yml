name: Auto-update
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Write dep helper
        run: cat > /tmp/dep_diff.py << 'PYEOF'
import json, sys, re, urllib.request

def parse_deps(url):
    try:
        resp = urllib.request.urlopen(url, timeout=15)
        text = resp.read().decode()
        m = re.search(r'dependencies\s*=\s*\[(.*?)\]', text, re.DOTALL)
        if not m: return set()
        return set(re.findall(r'"([^"]+)"', m.group(1)))
    except: return set()

pkg, d, cur, latest, entries = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4], sys.argv[5]
url_old, url_new = sys.argv[6], sys.argv[7]

old_deps = parse_deps(url_old)
new_deps = parse_deps(url_new)
added = sorted(new_deps - old_deps)
removed = sorted(old_deps - new_deps)

entry = {"pkg": pkg, "dir": d, "current": cur, "latest": latest}
if added: entry["deps_added"] = "\n".join(added)
if removed: entry["deps_removed"] = "\n".join(removed)

u = json.loads(entries)
u.append(entry)
print(json.dumps(u))
PYEOF

      - name: Scan packages
        id: scan
        run: |
          entries="[]"
          for dir in */; do
            pkg=$(basename "$dir")
            [[ "$pkg" == .* ]] && continue
            [ ! -f "$dir/PKGBUILD" ] && continue

            cur=$(grep -Po '(?<=^pkgver=).*' "$dir/PKGBUILD")
            [ -z "$cur" ] && continue
            url=$(grep -Po "(?<=url=')[^']*" "$dir/PKGBUILD")
            repo=$(echo "$url" | sed 's|https://github.com/||')
            tag=$(gh release view -R "$repo" --json tagName -q .tagName 2>/dev/null) || continue
            latest="${tag#v}"
            [ "$latest" = "$cur" ] && continue

            added="" removed=""
            pyproj_old="https://raw.githubusercontent.com/${repo}/v${cur}/pyproject.toml"
            pyproj_new="https://raw.githubusercontent.com/${repo}/${tag}/pyproject.toml"

            entries=$(python3 /tmp/dep_diff.py "$pkg" "$dir" "$cur" "$latest" "$entries" "$pyproj_old" "$pyproj_new")
          done
          echo "matrix={\"include\":$entries}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  create-prs:
    needs: detect
    if: needs.detect.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Bump version
        run: |
          d="${{ matrix.dir }}"
          ver="${{ matrix.latest }}"
          sed -i "s/^pkgver=.*/pkgver=${ver}/" "$d/PKGBUILD"
          sed -i "s/^pkgrel=.*/pkgrel=1/" "$d/PKGBUILD"
          if [ -f "$d/.SRCINFO" ]; then
            sed -i "s/^\([[:space:]]*\)pkgver = .*/\1pkgver = ${ver}/" "$d/.SRCINFO"
          fi

      - name: Build PR body
        id: msg
        run: |
          echo "bump ${{ matrix.pkg }} to v${{ matrix.latest }}" > /tmp/body
          [ -n "${{ matrix.deps_added }}" ] && { echo "" >> /tmp/body; echo "New deps:" >> /tmp/body; echo "${{ matrix.deps_added }}" | while read d; do echo "  + $d" >> /tmp/body; done; }
          [ -n "${{ matrix.deps_removed }}" ] && { echo "" >> /tmp/body; echo "Removed:" >> /tmp/body; echo "${{ matrix.deps_removed }}" | while read d; do echo "  - $d" >> /tmp/body; done; }
          echo "" >> /tmp/body
          echo "---" >> /tmp/body
          echo "Auto-detected. Review and merge to publish to AUR." >> /tmp/body
          body=$(cat /tmp/body)
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$body" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="bump/${{ matrix.pkg }}/v${{ matrix.latest }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "${{ matrix.dir }}"
          git commit -m "${{ steps.msg.outputs.body }}"
          git push origin "$branch"
          gh pr create \
            --title "bump ${{ matrix.pkg }} to v${{ matrix.latest }}" \
            --body "${{ steps.msg.outputs.body }}" \
            --head "$branch" \
            --base master
