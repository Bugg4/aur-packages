name: Publish to AUR

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      package:
        description: "Package directory name to publish (e.g. python-okf-generator)"
        required: true
        type: string

jobs:
  publish:
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'bump '))
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for git subtree

      - name: Detect package
        id: pkg
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.package }}" >> "$GITHUB_OUTPUT"
          else
            pkg=$(git diff --name-only HEAD~1 | grep -v '^\.github/' | grep -v '^\.gitignore' | grep -v '^\.nvchecker' | cut -d/ -f1 | sort -u | head -1)
            echo "name=$pkg" >> "$GITHUB_OUTPUT"
          fi

      - name: Install deps
        run: |
          pacman -Syu --noconfirm \
            pacman-contrib rsync \
            python python-build python-installer python-wheel python-hatchling \
            python-yaml python-tqdm python-watchdog \
            git openssh

      - name: Setup SSH
        shell: bash
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "${{ secrets.AUR_SSH_PRIVATE_KEY }}" | tr -d '\r' > "$HOME/.ssh/aur"
          chmod 600 "$HOME/.ssh/aur"
          ssh-keygen -y -f "$HOME/.ssh/aur" > /dev/null

      - name: Update checksums and .SRCINFO
        run: |
          pkg="${{ steps.pkg.outputs.name }}"
          dir="$PWD/$pkg"
          useradd -m builder
          chown -R builder:builder "$dir"
          cd "$dir"
          su builder -c "cd '$dir' && updpkgsums"
          su builder -c "cd '$dir' && makepkg --printsrcinfo > .SRCINFO"

      - name: Sync package to AUR
        shell: bash
        run: |
          pkg="${{ steps.pkg.outputs.name }}"
          source_dir="$PWD/$pkg"
          aur_dir="$(mktemp -d)"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          git clone "ssh://aur@aur.archlinux.org/$pkg.git" "$aur_dir"
          test -d "$aur_dir/.git"
          rsync -a --delete --filter='P .git' "$source_dir"/ "$aur_dir"/
          test -d "$aur_dir/.git"

          git -C "$aur_dir" config user.name "${{ secrets.AUR_USERNAME }}"
          git -C "$aur_dir" config user.email "${{ secrets.AUR_EMAIL }}"
          git -C "$aur_dir" add --all
          git -C "$aur_dir" diff --cached --quiet && exit 0
          ver=$(grep -Po '(?<=^pkgver=).*' "$source_dir/PKGBUILD")
          git -C "$aur_dir" commit -m "bump $pkg to v$ver"
          git -C "$aur_dir" push origin master
