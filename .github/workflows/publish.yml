name: Publish to AUR

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      package:
        description: "Package directory name to publish (e.g. python-okf-generator)"
        required: true
        type: string

jobs:
  publish:
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'bump '))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect package
        id: pkg
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            pkg="${{ inputs.package }}"
          else
            pkg=$(git diff --name-only HEAD~1 HEAD -- '*/PKGBUILD' | cut -d/ -f1 | sort -u | head -1)
          fi

          if [[ -z "$pkg" || ! -f "$pkg/PKGBUILD" ]]; then
            echo "No valid root package directory was selected" >&2
            exit 1
          fi

          version=$(sed -n 's/^pkgver=//p' "$pkg/PKGBUILD")
          echo "name=$pkg" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish package
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: ${{ steps.pkg.outputs.name }}
          asset_dir: ./${{ steps.pkg.outputs.name }}
          updpkgsums: true
          test: false
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "bump ${{ steps.pkg.outputs.name }} to v${{ steps.pkg.outputs.version }}"
